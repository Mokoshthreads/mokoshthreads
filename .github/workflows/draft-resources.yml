name: Research and draft Resources articles

on:
  push:
    branches: [main]
    paths: ['.github/workflows/draft-resources.yml']
  schedule:
    # 10am UTC+8 Tuesday–Sunday: up to three topics per run, sixteen total.
    - cron: '0 2 * * 2-6,0'
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Maximum topics to attempt (1–3); use 1 for the first test'
        type: choice
        options: ['1', '2', '3']
        default: '1'
      retry_blocked:
        description: 'Retry topics needing verification, after supplying evidence'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: resources-editorial-updates
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run editorial and scheduling tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Research, draft and independently review queued topics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DRAFT_MODEL: ${{ vars.OPENAI_DRAFT_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          MAX_ARTICLES: ${{ inputs.max_articles || (github.event_name == 'push' && '1') || '3' }}
          RETRY_BLOCKED: ${{ inputs.retry_blocked || 'false' }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if [ "$RETRY_BLOCKED" = 'true' ]; then
            python3 scripts/draft_resources.py --limit "$MAX_ARTICLES" --retry-blocked
          else
            python3 scripts/draft_resources.py --limit "$MAX_ARTICLES"
          fi
      - name: Retain draft progress even when a later topic fails
        if: always()
        run: |
          git add _editorial/ resources/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prepare researched Resources drafts and verification requests'
            git push origin HEAD:main
          fi
      - name: Preserve generated work if a repository push fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-recovery
          path: |
            _editorial/
            resources/
          retention-days: 7
      - name: Notify Telegram if drafting fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE: >-
            Mokosh Threads — automatic drafting needs attention.
            No unverified article was approved by this failed run.
            Check API billing, source access and the run log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/telegram_notify.py
